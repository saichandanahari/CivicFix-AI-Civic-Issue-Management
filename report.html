{% extends "base.html" %}{% block content %}<section class="form-page"><p class="eyebrow">CITIZEN PORTAL</p><h1>Report a Civic Issue</h1>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="form"><label>Name<input name="name" placeholder="Optional"></label><label>Description<textarea name="description" rows="6" required placeholder="Example: Huge pothole near school. Bikes are falling here."></textarea></label><label>Location<input name="location" required placeholder="Main Road, Ward 4"></label><label>Photo<input type="file" name="image" accept="image/*"></label><button class="btn primary">Analyze with AI & Submit</button></form></section>{% endblock %}
